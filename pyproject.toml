[project]
name = "paddling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.3.0",
    "ipykernel>=6.30.0",
    "jiwer>=4.0.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "pillow>=12.2.0",
    "requests>=2.33.1",
    "torch>=2.11.0",
    "transformers>=5.6.2",
]

# Install CUDA-enabled `torch` from the PyTorch wheel index (avoids CPU-only +cpu
# resolution from PyPI on Windows/WSL). Switch `cu128` to `cu126` or `cu130` to match
# your NVIDIA driver if needed. See: https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv]
# Copy from cache (no cross-FS hardlinks). If installs fail with ESTALE on `.venv`,
# put the env on local disk: `mkdir -p ~/.venvs/paddling && ln -sfn ~/.venvs/paddling .venv`.
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
